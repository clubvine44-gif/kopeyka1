<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Копейка — финансовый планировщик</title>
<meta name="theme-color" content="#14151B">
<meta name="description" content="Личный финансовый планировщик для посменной работы">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14151B;
  --surface:#1C1E26;
  --surface-2:#242631;
  --border:#2E3140;
  --text:#F2F1EC;
  --text-dim:#9B9CAA;
  --text-faint:#63657A;
  --day:#E8A33D;
  --day-soft:#3A2F1C;
  --night:#7C8AF5;
  --night-soft:#252A45;
  --off:#7FC9A0;
  --off-soft:#1E2E27;
  --safe:#4FD1A5;
  --danger:#F0665F;
  --danger-soft:#3A2020;
  --warn:#E8A33D;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --font-display:'Manrope',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root.theme-system{
    --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#EFEDE6; --border:#E2DFD6;
    --text:#1B1B1A; --text-dim:#66645C; --text-faint:#9A9789;
    --day-soft:#FCEBCB; --night-soft:#E4E6FA; --off-soft:#DDF0E5; --danger-soft:#FBE1DF;
    --shadow:0 8px 24px rgba(0,0,0,.08);
  }
}
:root.theme-light{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#EFEDE6; --border:#E2DFD6;
  --text:#1B1B1A; --text-dim:#66645C; --text-faint:#9A9789;
  --day-soft:#FCEBCB; --night-soft:#E4E6FA; --off-soft:#DDF0E5; --danger-soft:#FBE1DF;
  --shadow:0 8px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overscroll-behavior-y:none;
  transition:background .2s ease,color .2s ease;
}
h1,h2,h3,.display{font-family:var(--font-display);}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
#app{max-width:1200px;margin:0 auto;padding-top:calc(var(--safe-top));}
#main{padding:16px 16px calc(96px + var(--safe-bottom));min-height:100vh;}
@media(min-width:900px){#main{padding:24px 32px 48px 268px;}}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px calc(10px);
  background:linear-gradient(var(--bg) 70%, transparent);
}
@media(min-width:900px){.topbar{padding-left:268px;}}
.topbar .brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em;}
.brand .coin{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--day) 0 33%, var(--night) 33% 66%, var(--off) 66% 100%);display:inline-block;}
.topbar .icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* ---------- Bottom / side nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:space-around;align-items:center;
  background:var(--surface);border-top:1px solid var(--border);
  padding:6px 4px calc(6px + var(--safe-bottom));
}
@media(min-width:900px){
  .bottomnav{
    top:0;bottom:0;right:auto;width:240px;
    flex-direction:column;justify-content:flex-start;align-items:stretch;
    border-top:none;border-right:1px solid var(--border);
    padding:24px 14px;gap:4px;
  }
}
.navbtn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--text-faint);font-size:10.5px;
  padding:6px 10px;border-radius:12px;cursor:pointer;flex:1;
  transition:color .15s ease;
}
.navbtn svg{width:22px;height:22px;}
.navbtn.active{color:var(--safe);}
@media(min-width:900px){
  .navbtn{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:11px 14px;color:var(--text-dim);}
  .navbtn.active{background:var(--surface-2);color:var(--text);}
  .navbtn svg{width:19px;height:19px;}
}
.sidebar-brand{display:none;}
@media(min-width:900px){
  .sidebar-brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:20px;padding:4px 14px 22px;letter-spacing:-.02em;}
}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;}
.card-tight{padding:14px 16px;}
.section-title{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:22px 2px 10px;}
.section-title:first-child{margin-top:2px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(min-width:640px){.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-dim);font-weight:600;}
.pill.day{background:var(--day-soft);color:var(--day);}
.pill.night{background:var(--night-soft);color:var(--night);}
.pill.off{background:var(--off-soft);color:var(--off);}
.pill.danger{background:var(--danger-soft);color:var(--danger);}

/* ---------- Buttons ---------- */
.btn{border-radius:var(--radius-md);border:none;padding:13px 18px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s ease,opacity .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--safe);color:#08201A;}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-ghost{background:none;color:var(--text-dim);padding:10px 6px;}
.btn-block{width:100%;}
.fab{
  position:fixed;right:18px;bottom:calc(84px + var(--safe-bottom));z-index:25;
  width:56px;height:56px;border-radius:50%;background:var(--safe);color:#08201A;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);border:none;cursor:pointer;
}
@media(min-width:900px){.fab{bottom:32px;}}

/* ---------- Typography helpers ---------- */
.big-number{font-family:var(--font-mono);font-weight:700;font-size:40px;letter-spacing:-.02em;}
.mid-number{font-family:var(--font-mono);font-weight:700;font-size:22px;}
.label{font-size:12.5px;color:var(--text-dim);}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);font-size:12px;}
.pos{color:var(--safe);}
.neg{color:var(--danger);}

/* ---------- Home hero: cycle ring ---------- */
.hero{position:relative;overflow:hidden;padding:22px;}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.period-switch{display:flex;align-items:center;gap:10px;}
.period-switch button{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:50%;cursor:pointer;}
.spend-today{text-align:center;padding:14px 0 6px;}
.spend-today .label{font-size:13px;}
.cyclewrap{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:10px;flex-wrap:wrap;}
.ring{position:relative;width:132px;height:132px;flex:none;}
.ring svg{transform:rotate(-90deg);}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .center .t{font-size:11px;color:var(--text-dim);}
.ring .center .n{font-family:var(--font-display);font-weight:800;font-size:15px;}
.cyclelist{display:flex;flex-direction:column;gap:5px;font-size:12.5px;min-width:150px;}
.cyclelist .ci{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:8px;color:var(--text-dim);}
.cyclelist .ci.cur{background:var(--surface-2);color:var(--text);font-weight:600;}
.dot{width:8px;height:8px;border-radius:50%;flex:none;}
.dot.day{background:var(--day);} .dot.night{background:var(--night);} .dot.off{background:var(--off);}

/* ---------- Breakdown modal list ---------- */
.bk-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px;}
.bk-row:last-child{border-bottom:none;}
.bk-row .v{font-family:var(--font-mono);font-weight:600;}
.bk-total{font-weight:800;font-size:17px;}

/* ---------- List items ---------- */
.item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.item:last-child{border-bottom:none;}
.item .ico{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;}
.item .body{flex:1;min-width:0;}
.item .title{font-weight:600;font-size:14.5px;}
.item .sub{font-size:12px;color:var(--text-dim);margin-top:1px;}
.item .amt{font-family:var(--font-mono);font-weight:700;font-size:14.5px;white-space:nowrap;}
.empty{text-align:center;padding:44px 16px;color:var(--text-dim);}
.empty .em-ico{font-size:34px;margin-bottom:10px;}

/* ---------- Progress bar ---------- */
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.progress > div{height:100%;background:var(--safe);border-radius:99px;transition:width .3s ease;}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{text-align:center;font-size:11px;color:var(--text-faint);padding-bottom:4px;}
.cal-day{aspect-ratio:1/1;border-radius:11px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;border:1.5px solid transparent;font-size:12px;}
.cal-day.day{background:var(--day-soft);color:var(--day);}
.cal-day.night{background:var(--night-soft);color:var(--night);}
.cal-day.off{background:var(--off-soft);color:var(--off);}
.cal-day.other-month{opacity:.28;}
.cal-day.today{border-color:var(--text);}
.cal-day .dn{font-weight:700;font-size:13px;}
.cal-day .amt{font-size:8.5px;font-family:var(--font-mono);opacity:.85;}
.cal-day .status-mark{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;}
.cal-day .status-mark.cancelled{background:var(--danger);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:640px){.overlay{align-items:center;}}
.modal{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:20px 20px calc(24px + var(--safe-bottom));animation:slideup .22s ease;}
@media(min-width:640px){.modal{border-radius:22px;}}
@keyframes slideup{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h2{margin:0 0 16px;font-size:19px;}
.modal-close{position:absolute;top:16px;right:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:12px 13px;color:var(--text);font-size:15px;font-family:inherit;
}
.field textarea{resize:vertical;min-height:60px;}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px;}
.seg button{flex:1;background:none;border:none;color:var(--text-dim);padding:9px 6px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2);}
.check-row{display:flex;align-items:center;gap:10px;padding:11px 0;}
.check-row input{width:19px;height:19px;accent-color:var(--safe);}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:12px;font-size:14px;z-index:200;box-shadow:var(--shadow);}

.hidden{display:none !important;}
a{color:inherit;}
::selection{background:var(--safe);color:#08201A;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--safe);outline-offset:1px;}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>
<div id="app">
  <nav class="bottomnav" id="nav"></nav>
  <div class="topbar">
    <div class="sidebar-brand-mobile"></div>
  </div>
  <main id="main"></main>
  <button class="fab" id="fabBtn" aria-label="Добавить" title="Добавить">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
'use strict';
/* =========================================================================
   КОПЕЙКА — единый файл: хранилище, финансовый движок, интерфейс.
   ========================================================================= */

/* ---------------------------- ДАТЫ / ВРЕМЯ ------------------------------ */
function pad2(n){return String(n).padStart(2,'0');}
function toDateObj(str){const [y,m,d]=str.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));}
function toStr(d){return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());}
function addDays(str,n){const d=toDateObj(str);d.setUTCDate(d.getUTCDate()+n);return toStr(d);}
function diffDays(a,b){return Math.round((toDateObj(b)-toDateObj(a))/86400000);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function daysInMonth(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate();} // m is 1-based
function monthRange(y,m){const start=y+'-'+pad2(m)+'-01';const end=y+'-'+pad2(m)+'-'+pad2(daysInMonth(y,m));return {start,end};}
const DOW=['вс','пн','вт','ср','чт','пт','сб'];
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_NOM=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function fmtDateHuman(str){const d=toDateObj(str);return d.getUTCDate()+' '+MONTHS[d.getUTCMonth()];}
function weekday(str){return toDateObj(str).getUTCDay();}

/* ---------------------------- ДЕНЬГИ (в копейках, целые числа) --------- */
function toKop(rub){ if(rub===''||rub===null||rub===undefined||isNaN(rub)) return 0; return Math.round(Number(rub)*100); }
function toRub(kop){ return kop/100; }
const RUB_FMT=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
function fmt(kop, opts){
  opts=opts||{};
  if(kop===null||kop===undefined||isNaN(kop)) kop=0;
  const neg = kop<0;
  const abs = Math.abs(kop);
  const rub = Math.round(abs/100);
  let s = RUB_FMT.format(rub)+' ₽';
  if(opts.sign && !neg && rub>0) s='+'+s;
  if(neg) s='−'+s;
  return s;
}

/* ---------------------------- ХРАНИЛИЩЕ --------------------------------- */
const STORAGE_KEY='kopeyka_state_v1';
const SCHEMA_VERSION=1;
let uidCounter=1;
function uid(){ return 'id'+(Date.now().toString(36))+(uidCounter++).toString(36); }

function defaultState(){
  return {
    version: SCHEMA_VERSION,
    settings:{
      currency:'₽',
      anchorDate:'2026-08-17',
      anchorIndex:1, // индекс дня в cyclePattern, соответствующий anchorDate (2-я дневная)
      cyclePattern:['day','day','night','night','off','off'],
      shiftTypes:{
        day:{label:'Дневная', start:'07:00', end:'19:00', rate: toKop(4800)},
        night:{label:'Ночная', start:'19:00', end:'07:00', rate: toKop(4800)}
      },
      currentBalance:0,
      theme:'system',
      dailyLimitMode:'safe', // nores | safe | strict
      includeFutureIncome:true,
      includeFutureExpenses:true,
      includeReserves:true
    },
    shiftsOverride:{}, // dateStr -> {type,label,start,end,rate,status,comment}
    income:[],       // {id,title,amount,date,comment,status}
    expenses:[],     // {id,title,amount,category,date,mandatory,comment}
    recurring:[],    // {id,title,amount,startDate,endDate,periodicity,intervalDays,active,comment}
    reserves:[],     // {id,name,target,saved,mandatory,active,startDate,targetDate,method,fixedAmount,percent,priority}
    reserveOps:[],   // {id,reserveId,type,amount,date,comment}
    categories:['Продукты','Транспорт','Связь','Здоровье','Дети','Одежда','Развлечения','Другое']
  };
}

let STATE=null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ STATE=defaultState(); saveState(); return; }
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed!=='object'){ STATE=defaultState(); return; }
    // миграция/слияние с дефолтами на случай отсутствующих полей
    const def=defaultState();
    STATE = Object.assign({}, def, parsed);
    STATE.settings = Object.assign({}, def.settings, parsed.settings||{});
    STATE.settings.shiftTypes = Object.assign({}, def.settings.shiftTypes, (parsed.settings&&parsed.settings.shiftTypes)||{});
    STATE.settings.cyclePattern = (parsed.settings && parsed.settings.cyclePattern) || def.settings.cyclePattern;
    ['shiftsOverride','income','expenses','recurring','reserves','reserveOps','categories'].forEach(k=>{
      if(!STATE[k]) STATE[k]=def[k];
    });
  }catch(e){
    console.error('Ошибка загрузки данных, используются значения по умолчанию', e);
    STATE=defaultState();
  }
}
let saveTimer=null;
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    return true;
  }catch(e){
    console.error('Ошибка сохранения', e);
    showToast('Не удалось сохранить данные: '+(e.message||'ошибка хранилища'));
    return false;
  }
}
function persist(){ saveState(); render(); }

/* ---------------------------- ЦИКЛ СМЕН --------------------------------- */
function cycleIndexForDate(dateStr, settings){
  const diff = diffDays(settings.anchorDate, dateStr);
  let idx = (settings.anchorIndex + (diff % 6) + 6) % 6;
  return idx;
}
function generatedTypeForDate(dateStr, settings){
  return settings.cyclePattern[cycleIndexForDate(dateStr, settings)];
}
const TYPE_LABELS={day:'Дневная',night:'Ночная',off:'Выходной'};

function getShift(dateStr, state){
  const ov = state.shiftsOverride[dateStr];
  const today = todayStr();
  if(ov){
    return {
      date:dateStr, type:ov.type, label:ov.label || TYPE_LABELS[ov.type] || ov.type,
      amount: ov.amount||0, start:ov.start||null, end:ov.end||null,
      status: ov.status||'planned', comment: ov.comment||'', manual:true
    };
  }
  const type = generatedTypeForDate(dateStr, state.settings);
  if(type==='off'){
    return {date:dateStr,type:'off',label:'Выходной',amount:0,start:null,end:null,status:'off',comment:'',manual:false};
  }
  const cfg = state.settings.shiftTypes[type];
  if(!cfg){
    return {date:dateStr,type:type,label:type,amount:0,start:null,end:null,status:'off',comment:'',manual:false};
  }
  const status = dateStr<=today ? 'worked' : 'planned';
  return {date:dateStr,type:type,label:cfg.label,amount:cfg.rate,start:cfg.start,end:cfg.end,status:status,comment:'',manual:false};
}
function shiftIncomeAmount(shift){
  if(shift.status==='worked' || shift.status==='planned') return shift.amount||0;
  return 0;
}
function setShiftOverride(dateStr, patch){
  const current = getShift(dateStr, STATE);
  STATE.shiftsOverride[dateStr] = Object.assign({}, current, patch, {date:undefined});
  delete STATE.shiftsOverride[dateStr].date;
  delete STATE.shiftsOverride[dateStr].manual;
}
function clearShiftOverride(dateStr){ delete STATE.shiftsOverride[dateStr]; }

/* ---------------------------- ПОВТОРЯЮЩИЕСЯ ПЛАТЕЖИ ---------------------- */
function ruleMatchesDate(rule, dateStr){
  if(dateStr < rule.startDate) return false;
  if(rule.endDate && dateStr > rule.endDate) return false;
  const diff = diffDays(rule.startDate, dateStr);
  switch(rule.periodicity){
    case 'daily': return true;
    case 'weekly': return diff % 7 === 0;
    case 'monthly': {
      const y=Number(dateStr.slice(0,4)), m=Number(dateStr.slice(5,7)), dom=Number(dateStr.slice(8,10));
      const startDom = Number(rule.startDate.slice(8,10));
      const target = Math.min(startDom, daysInMonth(y,m));
      return dom===target;
    }
    case 'yearly': return dateStr.slice(5,10)===rule.startDate.slice(5,10);
    case 'custom': {
      const n = Math.max(1, rule.intervalDays||1);
      return diff % n === 0;
    }
    default: return false;
  }
}
function occurrencesInRange(rule, start, end){
  const dates=[];
  let s = start > rule.startDate ? start : rule.startDate;
  let e = (rule.endDate && rule.endDate < end) ? rule.endDate : end;
  if(s>e) return dates;
  for(let d=s; d<=e; d=addDays(d,1)){
    if(ruleMatchesDate(rule,d)) dates.push(d);
    if(dates.length>2000) break; // защита от бесконечных циклов
  }
  return dates;
}

/* ---------------------------- РЕЗЕРВЫ: НЕОБХОДИМЫЙ ВЗНОС ------------------ */
function reserveRawNeed(reserve, periodStart, periodEnd, totalIncomeForPeriod){
  if(!reserve.active) return 0;
  const today = todayStr();
  let need=0;
  if(reserve.method==='fixed'){
    const y=Number(periodStart.slice(0,4)), m=Number(periodStart.slice(5,7));
    const dim = daysInMonth(y,m);
    const periodDays = diffDays(periodStart,periodEnd)+1;
    need = (reserve.fixedAmount||0) * (periodDays/dim);
  } else if(reserve.method==='percent'){
    need = totalIncomeForPeriod * ((reserve.percent||0)/100);
  } else if(reserve.method==='target' && reserve.targetDate){
    const remain = Math.max(0, (reserve.target||0) - (reserve.saved||0));
    const allocStart = periodStart>today ? periodStart : today;
    const allocEnd = periodEnd < reserve.targetDate ? periodEnd : reserve.targetDate;
    if(allocStart<=allocEnd && reserve.targetDate>=today){
      const daysUntilTarget = Math.max(1, diffDays(allocStart>today?allocStart:today, reserve.targetDate));
      const overlapDays = Math.max(0, diffDays(allocStart,allocEnd)+1);
      const dailyRate = remain/Math.max(1,diffDays(today,reserve.targetDate));
      need = dailyRate*overlapDays;
    }
  }
  const depositsInPeriod = STATE.reserveOps
    .filter(op=>op.reserveId===reserve.id && op.type==='deposit' && op.date>=periodStart && op.date<=periodEnd)
    .reduce((s,op)=>s+op.amount,0);
  return Math.max(0, Math.round(need) - depositsInPeriod);
}

/* ---------------------------- ГЛАВНЫЙ РАСЧЁТ ЗА ПЕРИОД -------------------- */
function computePeriodSummary(state, periodStart, periodEnd){
  const today = todayStr();
  let actualShiftIncome=0, expectedShiftIncome=0;
  let d=periodStart;
  const shiftsList=[];
  while(d<=periodEnd){
    const sh = getShift(d, state);
    shiftsList.push(sh);
    const amt = shiftIncomeAmount(sh);
    if(sh.status==='worked') actualShiftIncome+=amt;
    else if(sh.status==='planned') expectedShiftIncome+=amt;
    d=addDays(d,1);
  }
  let actualManualIncome=0, expectedManualIncome=0;
  state.income.filter(i=>i.date>=periodStart && i.date<=periodEnd).forEach(i=>{
    if(i.status==='actual') actualManualIncome+=i.amount; else expectedManualIncome+=i.amount;
  });
  const actualIncome = actualShiftIncome+actualManualIncome;
  const expectedIncome = expectedShiftIncome+expectedManualIncome;
  const totalIncome = actualIncome+expectedIncome;

  let actualRegular=0, plannedRegular=0, actualObligatory=0, plannedObligatory=0;
  state.expenses.filter(e=>e.date>=periodStart && e.date<=periodEnd).forEach(e=>{
    const bucket = e.date<=today ? 'actual':'planned';
    if(e.mandatory){ if(bucket==='actual') actualObligatory+=e.amount; else plannedObligatory+=e.amount; }
    else { if(bucket==='actual') actualRegular+=e.amount; else plannedRegular+=e.amount; }
  });
  state.recurring.filter(r=>r.active).forEach(r=>{
    occurrencesInRange(r, periodStart, periodEnd).forEach(dt=>{
      const bucket = dt<=today ? 'actual':'planned';
      if(bucket==='actual') actualObligatory+=r.amount; else plannedObligatory+=r.amount;
    });
  });
  const totalRegular = actualRegular+plannedRegular;
  const totalObligatory = actualObligatory+plannedObligatory;

  let reservesNeeded=0;
  const reserveBreakdown=[];
  state.reserves.filter(r=>r.active).forEach(r=>{
    const need = reserveRawNeed(r, periodStart, periodEnd, totalIncome);
    reservesNeeded+=need;
    reserveBreakdown.push({reserve:r, need});
  });

  const currentBalance = state.settings.currentBalance||0;

  // "Сейчас" — то, что реально есть на руках
  const availableNow = currentBalance;

  // "До конца периода" — прогноз с учётом будущих операций
  const forecastBeforeReserves = currentBalance + expectedIncome - plannedRegular - plannedObligatory;
  const forecastAfterReserves = forecastBeforeReserves - reservesNeeded;

  // "Строгий" режим — не учитывает ещё не полученный доход
  const strictAvailable = currentBalance - plannedRegular - plannedObligatory - reservesNeeded;

  const remainingDays = periodEnd < today ? 0 : (diffDays(today>periodStart?today:periodStart, periodEnd) + 1);

  const noReserveLimit = remainingDays>0 ? Math.round(forecastBeforeReserves/remainingDays) : null;
  const safeLimit = remainingDays>0 ? Math.round(forecastAfterReserves/remainingDays) : null;
  const strictLimit = remainingDays>0 ? Math.round(strictAvailable/remainingDays) : null;

  // приоритетное распределение резервов для отображения дефицита (раздел 22)
  const pool0 = Math.max(0, forecastBeforeReserves);
  let poolLeft = pool0;
  const sortedReserves = reserveBreakdown.slice().sort((a,b)=>(a.reserve.priority||99)-(b.reserve.priority||99));
  const allocation = sortedReserves.map(rb=>{
    const alloc = Math.min(rb.need, Math.max(0,poolLeft));
    poolLeft -= alloc;
    return {reserve:rb.reserve, need:rb.need, allocated:alloc, deficit:rb.need-alloc};
  });

  return {
    periodStart, periodEnd, remainingDays,
    shiftsList,
    actualShiftIncome, expectedShiftIncome, actualManualIncome, expectedManualIncome,
    actualIncome, expectedIncome, totalIncome,
    actualRegular, plannedRegular, totalRegular,
    actualObligatory, plannedObligatory, totalObligatory,
    reservesNeeded, reserveBreakdown, allocation,
    currentBalance, availableNow,
    forecastBeforeReserves, forecastAfterReserves, strictAvailable,
    noReserveLimit, safeLimit, strictLimit
  };
}
function limitForMode(summary, mode){
  if(mode==='nores') return summary.noReserveLimit;
  if(mode==='strict') return summary.strictLimit;
  return summary.safeLimit;
}
function forecastForMode(summary, mode){
  if(mode==='nores') return summary.forecastBeforeReserves;
  if(mode==='strict') return summary.strictAvailable;
  return summary.forecastAfterReserves;
}

function cycleRingSVG(idx){
  const R=54,C=2*Math.PI*R;
  const colors={day:'var(--day)',night:'var(--night)',off:'var(--off)'};
  const seg=C/6;
  let circles='';
  const order=STATE.settings.cyclePattern;
  for(let i=0;i<6;i++){
    const col=colors[order[i]]||'var(--border)';
    const dashoffset = -(i*seg);
    const active = i===idx;
    circles+='<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="'+(active?10:7)+'" stroke-dasharray="'+(seg-3)+' '+(C-seg+3)+'" stroke-dashoffset="'+dashoffset+'" stroke-linecap="round" opacity="'+(active?1:.45)+'"/>';
  }
  return '<svg width="132" height="132" viewBox="0 0 132 132">'+circles+'</svg>';
}

}
function calDayCell(dstr,other){
  const sh=getShift(dstr,STATE);
  const today=todayStr();
  const dnum=Number(dstr.slice(8,10));
  let cls='cal-day '+sh.type+(other?' other-month':'')+(dstr===today?' today':'');
  let mark='';

  return '<div class="'+cls+'" data-date="'+dstr+'">'+mark+'<div class="dn">'+dnum+'</div>'+amtTxt+'</div>';

/* ---------------------------- SHIFT MODAL --------------------------------- */
function openShiftModal(dateStr){
  const sh=getShift(dateStr,STATE);
  const types=Object.keys(STATE.settings.shiftTypes);
  let h='<div class="modal">';
  h+=modalHeader('Смена — '+fmtDateHuman(dateStr));
  h+='<div class="field"><label>Тип дня</label><div class="seg" id="typeSeg">';
  h+='<button data-type="off" class="'+(sh.type==='off'?'active':'')+'">Выходной</button>';
  types.forEach(t=>{ h+='<button data-type="'+t+'" class="'+(sh.type===t?'active':'')+'">'+STATE.settings.shiftTypes[t].label+'</button>'; });
  h+='</div></div>';
  h+='<div class="field" id="rateField" style="'+(sh.type==='off'?'display:none':'')+'"><label>Ставка (₽)</label><input type="number" id="fRate" value="'+Math.round((sh.amount||0)/100)+'"></div>';
  h+='<div class="field" id="statusField" style="'+(sh.type==='off'?'display:none':'')+'"><label>Статус</label><select id="fStatus">';
  [['planned','Запланирована'],['worked','Отработана'],['cancelled','Отменена'],['absence','Другое отсутствие']].forEach(o=>{
    h+='<option value="'+o[0]+'" '+(sh.status===o[0]?'selected':'')+'>'+o[1]+'</option>';
  });
  h+='</select></div>';
  h+='<div class="field"><label>Комментарий</label><input type="text" id="fComment" value="'+esc(sh.comment||'')+'"></div>';
  h+='<div class="modal-actions"><button class="btn btn-secondary btn-block" data-act="resetDay">Сбросить к графику</button><button class="btn btn-primary btn-block" data-act="saveDay">Сохранить</button></div>';
  h+='</div>';
  showModal(h);
  document.querySelectorAll('#typeSeg [data-type]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#typeSeg [data-type]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const isOff=b.dataset.type==='off';
    document.getElementById('rateField').style.display=isOff?'none':'';
    document.getElementById('statusField').style.display=isOff?'none':'';
    if(!isOff){ document.getElementById('fRate').value=Math.round((STATE.settings.shiftTypes[b.dataset.type].rate)/100); }
  }));
  document.querySelector('[data-act=saveDay]').addEventListener('click',()=>{
    const type=document.querySelector('#typeSeg .active').dataset.type;
    const comment=document.getElementById('fComment').value.trim();
    if(type==='off'){
      setShiftOverride(dateStr,{type:'off',label:'Выходной',amount:0,start:null,end:null,status:'off',comment});
    } else {
      const rate=toKop(document.getElementById('fRate').value);
      const status=document.getElementById('fStatus').value;
      const cfg=STATE.settings.shiftTypes[type];
      setShiftOverride(dateStr,{type,label:cfg.label,amount:rate,start:cfg.start,end:cfg.end,status,comment});
    }
    closeModal(); persist(); showToast('Смена сохранена');
  });
  document.querySelector('[data-act=resetDay]').addEventListener('click',()=>{
    clearShiftOverride(dateStr); closeModal(); persist(); showToast('Возвращено к автоматическому графику');
  });
}

function renderIncome(){
  const {start,end}=currentPeriod();
  const summary=computePeriodSummary(STATE,start,end);
  let h='';
  h+='<div class="grid2">';
  h+=statCard('Заработано', fmt(summary.actualIncome), 'факт', [], '');

  h+='<div class="card" style="text-align:center;"><div class="label">Прогноз дохода за период</div><div class="mid-number">'+fmt(summary.totalIncome)+'</div></div>';

  h+='<div class="section-title">Доход от смен</div>';
  h+='<div class="card">';
  const shiftIncomes=summary.shiftsList.filter(s=>s.type!=='off' && s.status!=='cancelled' && s.status!=='absence');
  if(!shiftIncomes.length){ h+=emptyState('Смен с доходом в этом периоде нет','&#128197;'); }
  else{
    shiftIncomes.forEach(s=>{
      h+=itemRow(TYPE_LABELS[s.type]==='Ночная'?'&#127769;':'&#9728;&#65039;', s.label, fmtDateHuman(s.date)+' &middot; '+(s.status==='worked'?'отработана':'запланирована'), fmt(s.amount), 'shift:'+s.date);
    });
  }
  h+='</div>';

  h+='<div class="section-title">Дополнительный доход</div>';
  const manual=STATE.income.filter(i=>i.date>=start && i.date<=end).sort((a,b)=>b.date.localeCompare(a.date));
  h+='<div class="card">';
  if(!manual.length){ h+=emptyState('Дополнительного дохода пока нет','&#128176;'); }
  else{ manual.forEach(i=>{ h+=itemRow('&#128181;', i.title, fmtDateHuman(i.date)+' &middot; '+(i.status==='actual'?'получено':'ожидается'), fmt(i.amount), 'income:'+i.id); }); }

  document.getElementById('main').innerHTML=h;

function itemRow(ico,title,sub,amt,dataId,amtClass){
  return '<div class="item" data-open="'+dataId+'"><div class="ico">'+ico+'</div><div class="body"><div class="title">'+esc(title)+'</div><div class="sub">'+sub+'</div></div><div class="amt '+(amtClass||'')+'">'+amt+'</div></div>';
}
function emptyState(text,ico){
  return '<div class="empty"><div class="em-ico">'+ico+'</div><div>'+text+'</div></div>';
}
function bindListClicks(){
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{
    const v=el.dataset.open;
    if(v.startsWith('shift:')) openShiftModal(v.slice(6));
    else if(v.startsWith('income:')) openIncomeModal(v.slice(7));
    else if(v.startsWith('expense:')) openExpenseModal(v.slice(8));
    else if(v.startsWith('recurring:')) openRecurringModal(v.slice(10));
    else if(v.startsWith('reserve:')) openReserveModal(v.slice(8));
  }));
}

function renderReserves(){
  const {start,end}=currentPeriod();
  const summary=computePeriodSummary(STATE,start,end);
  let h='';
  const saved=STATE.reserves.reduce((s,r)=>s+(r.saved||0),0);
  const target=STATE.reserves.filter(r=>r.active).reduce((s,r)=>s+(r.target||0),0);
  h+='<div class="grid2">';
  h+=statCard('Накоплено', fmt(saved),'всего',[],'');
  h+=statCard('Нужно в этом периоде', fmt(summary.reservesNeeded),'осталось отложить',[],'');
  h+='</div>';

  if(summary.allocation.some(a=>a.deficit>0)){
    h+='<div class="card" style="border-color:var(--warn);">';
    h+='<div class="row"><strong>Дефицит по резервам</strong></div>';
    h+='<div class="faint" style="margin-bottom:8px;">Доступных денег не хватает на все резервы в приоритетном порядке:</div>';
    summary.allocation.forEach(a=>{
      if(a.deficit>0) h+='<div class="bk-row"><span>'+esc(a.reserve.name)+'</span><span class="v neg">не хватает '+fmt(a.deficit)+'</span></div>';
    });
    h+='</div>';
  }

  if(!STATE.reserves.length){ h+='<div class="card">'+emptyState('Резервов пока нет','&#128176;')+'</div>'; }
  else{
    STATE.reserves.slice().sort((a,b)=>(a.priority||99)-(b.priority||99)).forEach(r=>{
      const pct = r.target>0 ? Math.min(100,Math.round(100*(r.saved||0)/r.target)) : 0;
      h+='<div class="card" data-open="reserve:'+r.id+'" style="cursor:pointer;">';
      h+='<div class="row"><div style="font-weight:700;">'+esc(r.name)+'</div>';
      h+='<div>'+(r.mandatory?'<span class="pill">обязательный</span>':'')+(r.active?'':' <span class="pill">выключен</span>')+'</div></div>';

    const name=document.getElementById('fName').value.trim()||'Резерв';
    const target=toKop(document.getElementById('fTarget').value);
    const saved=toKop(document.getElementById('fSaved').value);
    const method=document.querySelector('[data-method].active').dataset.method;
    const fixedAmount=toKop(document.getElementById('fFixed').value);
    const percent=Number(document.getElementById('fPercent').value)||0;
    const targetDate=document.getElementById('fTargetDate').value||'';
    const priority=Number(document.getElementById('fPriority').value)||1;
    const mandatory=document.getElementById('fMand').checked;
    const active=document.getElementById('fActive').checked;
    if(id){ Object.assign(rec,{name,target,saved,method,fixedAmount,percent,targetDate,priority,mandatory,active}); }
    else { rec.name=name;rec.target=target;rec.saved=saved;rec.method=method;rec.fixedAmount=fixedAmount;rec.percent=percent;rec.targetDate=targetDate;rec.priority=priority;rec.mandatory=mandatory;rec.active=active;rec.id=uid();rec.startDate=todayStr(); STATE.reserves.push(rec); }
    closeModal(); persist(); showToast('Резерв сохранён');
  });
  if(id){
    document.querySelector('[data-act=del]').addEventListener('click',()=>confirmDelete('Удалить резерв «'+rec.name+'»? История операций также будет удалена.',()=>{
      STATE.reserves=STATE.reserves.filter(r=>r.id!==id);
      STATE.reserveOps=STATE.reserveOps.filter(o=>o.reserveId!==id);
      closeModal(); persist(); showToast('Резерв удалён');
    }));
    document.querySelector('[data-act=deposit]').addEventListener('click',()=>openReserveOpModal(id,'deposit'));
    document.querySelector('[data-act=withdraw]').addEventListener('click',()=>openReserveOpModal(id,'withdraw'));
  }
}
function openReserveOpModal(reserveId,type){
  const reserve=STATE.reserves.find(r=>r.id===reserveId);
  let h='<div class="modal">';
  h+=modalHeader(type==='deposit'?'Пополнить резерв':'Снять из резерва');
  h+=field('number','fAmt','Сумма, ₽','','');
  h+=field('text','fComment','Комментарий','','');
  h+='<div class="modal-actions"><button class="btn btn-primary btn-block" data-act="ok">Сохранить</button></div></div>';
  showModal(h);
  document.querySelector('[data-act=ok]').addEventListener('click',()=>{
    const amount=toKop(document.getElementById('fAmt').value);
    if(amount<=0){ showToast('Введите сумму больше нуля'); return; }
    if(type==='withdraw' && amount>reserve.saved){ showToast('Нельзя снять больше, чем накоплено'); return; }
    reserve.saved = type==='deposit' ? (reserve.saved||0)+amount : (reserve.saved||0)-amount;
    STATE.reserveOps.push({id:uid(),reserveId,type,amount,date:todayStr(),comment:document.getElementById('fComment').value.trim()});
    closeModal(); persist(); showToast(type==='deposit'?'Резерв пополнен':'Средства сняты');
  });
}

/* ---------------------------- RENDER: SETTINGS ------------------------------ */
function renderSettings(){
  const s=STATE.settings;
  let h='';
  h+='<div class="section-title">Работа</div>';
  h+='<div class="card">';
  h+=field('number','sDayRate','Ставка дневной смены, ₽',Math.round(s.shiftTypes.day.rate/100),'');
  h+=field('time','sDayStart','Начало дневной',s.shiftTypes.day.start,'');
  h+=field('time','sDayEnd','Конец дневной',s.shiftTypes.day.end,'');
  h+='<div style="height:8px;"></div>';
  h+=field('number','sNightRate','Ставка ночной смены, ₽',Math.round(s.shiftTypes.night.rate/100),'');
  h+=field('time','sNightStart','Начало ночной',s.shiftTypes.night.start,'');
  h+=field('time','sNightEnd','Конец ночной',s.shiftTypes.night.end,'');
  h+='<div style="height:8px;"></div>';
  h+=field('date','sAnchor','Дата привязки графика',s.anchorDate,'');
  h+='<div class="field"><label>Тип дня привязки (положение в цикле)</label><select id="sAnchorIdx">';
  const names=['1-я дневная','2-я дневная','1-я ночная','2-я ночная','1-й выходной','2-й выходной'];
  names.forEach((n,i)=>h+='<option value="'+i+'" '+(s.anchorIndex===i?'selected':'')+'>'+n+'</option>');
  h+='</select></div>';
  h+='<button class="btn btn-secondary btn-block" data-act="saveWork">Сохранить</button>';
  h+='</div>';

  h+='<div class="section-title">Финансы</div>';
  h+='<div class="card">';
  h+=field('number','sBalance','Текущий баланс, ₽',Math.round(s.currentBalance/100),'');
  h+='<button class="btn btn-secondary btn-block" data-act="saveBalance">Сохранить</button>';
  h+='</div>';

  h+='<div class="section-title">Дневной лимит</div>';
  h+='<div class="card">';
  h+='<div class="seg">';
  [['nores','Без резервов'],['safe','С резервами'],['strict','Строгий']].forEach(o=>{
    h+='<button data-limitmode="'+o[0]+'" class="'+(s.dailyLimitMode===o[0]?'active':'')+'">'+o[1]+'</button>';
  });
  h+='</div></div>';

  h+='<div class="section-title">Оформление</div>';
  h+='<div class="card"><div class="seg">';
  [['system','Системная'],['light','Светлая'],['dark','Тёмная']].forEach(o=>{
    h+='<button data-theme="'+o[0]+'" class="'+(s.theme===o[0]?'active':'')+'">'+o[1]+'</button>';
  });
  h+='</div></div>';

  h+='<div class="section-title">Данные</div>';
  h+='<div class="card">';
  h+='<button class="btn btn-secondary btn-block" data-act="export" style="margin-bottom:10px;">Экспортировать данные</button>';
  h+='<button class="btn btn-secondary btn-block" data-act="importBtn" style="margin-bottom:10px;">Импортировать данные</button>';
  h+='<input type="file" id="importFile" accept="application/json" class="hidden">';
  h+='<button class="btn btn-danger btn-block" data-act="reset">Полный сброс данных</button>';
  h+='</div>';

  h+='<div class="faint" style="text-align:center;padding:10px 0 30px;">Копейка &middot; данные хранятся локально на этом устройстве</div>';

  document.getElementById('main').innerHTML=h;

  document.querySelector('[data-act=saveWork]').addEventListener('click',()=>{
    s.shiftTypes.day.rate=toKop(document.getElementById('sDayRate').value);
    s.shiftTypes.day.start=document.getElementById('sDayStart').value;
    s.shiftTypes.day.end=document.getElementById('sDayEnd').value;
    s.shiftTypes.night.rate=toKop(document.getElementById('sNightRate').value);
    s.shiftTypes.night.start=document.getElementById('sNightStart').value;
    s.shiftTypes.night.end=document.getElementById('sNightEnd').value;
    s.anchorDate=document.getElementById('sAnchor').value||s.anchorDate;
    s.anchorIndex=Number(document.getElementById('sAnchorIdx').value);
    persist(); showToast('Настройки сохранены');
  });
  document.querySelector('[data-act=saveBalance]').addEventListener('click',()=>{
    s.currentBalance=toKop(document.getElementById('sBalance').value);
    persist(); showToast('Баланс обновлён');
  });
  document.querySelectorAll('[data-limitmode]').forEach(b=>b.addEventListener('click',()=>{ s.dailyLimitMode=b.dataset.limitmode; persist(); }));
  document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{ s.theme=b.dataset.theme; applyTheme(); persist(); }));
  document.querySelector('[data-act=export]').addEventListener('click',exportData);
  document.querySelector('[data-act=importBtn]').addEventListener('click',()=>document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change',importData);
  document.querySelector('[data-act=reset]').addEventListener('click',()=>confirmDelete('Удалить абсолютно все данные приложения? Это действие необратимо.',()=>{
    localStorage.removeItem(STORAGE_KEY); STATE=defaultState(); saveState(); closeModal(); render(); showToast('Все данные удалены');
  }));
}
function applyTheme(){
  document.documentElement.classList.remove('theme-light','theme-system');
  if(STATE.settings.theme==='light') document.documentElement.classList.add('theme-light');
  else if(STATE.settings.theme==='system') document.documentElement.classList.add('theme-system');
}
function exportData(){
  const blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='kopeyka-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Файл резервной копии создан');
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data || typeof data!=='object' || !data.settings) throw new Error('bad structure');
      showConfirmModal('Заменить все текущие данные содержимым файла?','Импорт данных',()=>{
        const def=defaultState();
        STATE=Object.assign({},def,data);
        STATE.settings=Object.assign({},def.settings,data.settings||{});
        closeModal(); saveState(); render(); showToast('Данные импортированы');
      });
    }catch(err){
      showToast('Файл повреждён или имеет неверный формат');
    }
  };
  reader.readAsText(file);
  e.target.value='';
}

/* ---------------------------- RENDER: ANALYTICS ------------------------------ */
function renderAnalytics(){
  const {start,end}=currentPeriod();
  const summary=computePeriodSummary(STATE,start,end);
  const pm = VIEW_MONTH.m===1 ? {y:VIEW_MONTH.y-1,m:12} : {y:VIEW_MONTH.y,m:VIEW_MONTH.m-1};
  const prevRange = monthRange(pm.y,pm.m);
  const prevSummary = computePeriodSummary(STATE, prevRange.start, prevRange.end);

  let h='<div class="row" style="margin-bottom:10px;"><button class="btn btn-ghost" data-act="back">&#8592; Назад</button></div>';
  h+='<div class="section-title">'+MONTHS_NOM[VIEW_MONTH.m-1]+' '+VIEW_MONTH.y+' &middot; сравнение с '+MONTHS_NOM[pm.m-1]+'</div>';

  const rows=[
    ['Доход', summary.totalIncome, prevSummary.totalIncome],
    ['Расходы', summary.totalRegular, prevSummary.totalRegular],
    ['Обязательные', summary.totalObligatory, prevSummary.totalObligatory],
    ['Накопления', summary.reservesNeeded, prevSummary.reservesNeeded],
    ['Свободные деньги', summary.forecastAfterReserves, prevSummary.forecastAfterReserves]
  ];
  h+='<div class="card">';
  rows.forEach(r=>{
    const diff=r[1]-r[2];
    const max=Math.max(Math.abs(r[1]),Math.abs(r[2]),1);
    const w1=Math.round(30+70*Math.abs(r[1])/max), w2=Math.round(30+70*Math.abs(r[2])/max);
    h+='<div style="margin-bottom:14px;">';
    h+='<div class="row" style="font-size:13px;"><span>'+r[0]+'</span><span class="mono '+(diff>=0?'pos':'neg')+'">'+(diff>=0?'+':'')+fmt(diff)+'</span></div>';
    h+='<div class="progress" style="margin-top:5px;"><div style="width:'+w1+'%;background:var(--safe);"></div></div>';
    h+='<div class="progress" style="margin-top:3px;opacity:.5;"><div style="width:'+w2+'%;background:var(--text-faint);"></div></div>';
    h+='</div>';
  });
  h+='<div class="faint">Верхняя полоса — текущий период, нижняя — предыдущий</div>';
  h+='</div>';

  const days=diffDays(start,end)+1;
  const avgDaily = days>0 ? Math.round((summary.totalRegular+summary.totalObligatory)/days) : 0;
  h+='<div class="card card-tight"><div class="label">Средний расход в день</div><div class="mid-number">'+fmt(avgDaily)+'</div></div>';

  document.getElementById('main').innerHTML=h;
  document.querySelector('[data-act=back]').addEventListener('click',()=>{ROUTE='home';render();});
}

/* ---------------------------- MODAL HELPERS ------------------------------ */
function modalHeader(title){
  return '<h2>'+esc(title)+'<button class="icon-btn modal-close" data-act="close" style="position:absolute;">'+ICONS.close+'</button></h2>';
}
function showModal(html){
  document.getElementById('modalRoot').innerHTML='<div class="overlay" id="overlay">'+html+'</div>';
  const ov=document.getElementById('overlay');
  ov.addEventListener('click',(e)=>{ if(e.target===ov) closeModal(); });
  document.querySelectorAll('[data-act=close]').forEach(b=>b.addEventListener('click',closeModal));
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function confirmDelete(msg,onConfirm){ showConfirmModal(msg,'Подтвердите удаление',onConfirm,true); }
function showConfirmModal(msg,title,onConfirm,danger){
  let h='<div class="modal" style="max-width:380px;">';
  h+=modalHeader(title);
  h+='<div style="margin-bottom:18px;">'+esc(msg)+'</div>';
  h+='<div class="modal-actions"><button class="btn btn-secondary btn-block" data-act="cancel">Отмена</button><button class="btn '+(danger?'btn-danger':'btn-primary')+' btn-block" data-act="ok">Подтвердить</button></div>';
  h+='</div>';
  showModal(h);
  document.querySelector('[data-act=cancel]').addEventListener('click',closeModal);
  document.querySelector('[data-act=ok]').addEventListener('click',onConfirm);
}

/* ---------------------------- FAB (быстрое добавление) ------------------- */
function openFabMenu(){
  let h='<div class="modal" style="max-width:380px;">';
  h+=modalHeader('Добавить');
  const opts=[
    ['Смену', 'shift'], ['Доход','income'], ['Расход','expense'],
    ['Обязательный платёж','recurring'], ['Резерв','reserve']
  ];
  opts.forEach(o=>{ h+='<button class="btn btn-secondary btn-block" style="margin-bottom:9px;" data-add="'+o[1]+'">'+o[0]+'</button>'; });
  h+='<button class="btn btn-secondary btn-block" style="margin-top:9px;border-top:1px solid var(--border);padding-top:18px;" data-add="undo">↶ Отменить последнее действие</button>';
  h+='</div>';
  showModal(h);
  document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{
    const t=b.dataset.add; closeModal();
    if(t==='shift') openShiftModal(todayStr());
    else if(t==='income') openIncomeModal(null);
    else if(t==='expense') openExpenseModal(null);
    else if(t==='recurring') openRecurringModal(null);
    else if(t==='reserve') openReserveModal(null);
    else if(t==='undo') window.kopeykaOpenUndo && window.kopeykaOpenUndo();
  }));
}

/* ---------------------------- MAIN RENDER --------------------------------- */
function render(){
  renderNav();
  if(ROUTE==='home') renderHome();
  else if(ROUTE==='calendar') renderCalendar();
  else if(ROUTE==='income') renderIncome();
  else if(ROUTE==='expenses') renderExpenses();
  else if(ROUTE==='reserves') renderReserves();
  else if(ROUTE==='settings') renderSettings();
  else if(ROUTE==='analytics') renderAnalytics();
  else if(ROUTE==='notes') renderNotes();
}

/* ---------------------------- INIT ---------------------------------------- */
document.getElementById('fabBtn').addEventListener('click',openFabMenu);
loadState();
applyTheme();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
